name: ci
# Every push and PR to main or next (changes collect on next; a release merges next into main every 7-10 days): private-data check, plugin validation, tests.
# A green push to main then tags and releases: v$(VERSION) if that tag does not exist yet, else the next patch.
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Private-data check
        env:
          DENY_PATTERNS: ${{ secrets.DENY_PATTERNS }}
        run: python3 .github/scripts/pii_check.py .
      - name: Highlights (3-6 bullets)
        run: python3 .github/scripts/highlights.py
      - name: Autonomy phrases (old broad escalation wording must not return)
        run: |
          python3 .github/scripts/autonomy_lint.py
          python3 bin/cos.py autonomy-drill --dry-run
      - name: Editions up to date (directory/, chatgpt/)
        run: python3 .github/scripts/build_editions.py --check
      - name: Directory edition policy phrases
        run: python3 .github/scripts/directory_lint.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plugin validation (directory profile)
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate . --profile directory
          claude plugin validate ./directory --profile directory
      - name: Tests
        run: |
          python3 -m unittest discover -s tests
          bash tests/test_install.sh
          node --test tests/test_sidebar_actions.mts
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Highlights
        run: python3 .github/scripts/highlights.py > /tmp/highlights.md
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Guten Group"
          git config user.email "noreply@guten.group"
          v=$(tr -d ' \n' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            if [ "$(git rev-list -n1 "v$v")" = "$(git rev-parse HEAD)" ]; then
              if gh release view "v$v" >/dev/null 2>&1; then echo "HEAD is already v$v, released"; exit 0; fi
              prev=$(git describe --tags --abbrev=0 "v$v^" 2>/dev/null || true)
              gh release create "v$v" --title "Chief of Staff v$v" --notes-file /tmp/highlights.md --generate-notes ${prev:+--notes-start-tag "$prev"}
              exit 0
            fi
            IFS=. read -r a b c <<<"$v"; v="$a.$b.$((c + 1))"
            echo "$v" > VERSION
            python3 - "$v" <<'PY'
          import json, sys
          p = ".claude-plugin/plugin.json"; d = json.load(open(p)); d["version"] = sys.argv[1]
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          PY
            git commit -qam "Release v$v [skip release]"
            git push -q origin HEAD:main
          fi
          git tag -a "v$v" -m "Chief of Staff v$v"
          git push -q origin "v$v"
          prev=$(git describe --tags --abbrev=0 "v$v^" 2>/dev/null || true)
          gh release create "v$v" --title "Chief of Staff v$v" --notes-file /tmp/highlights.md --generate-notes ${prev:+--notes-start-tag "$prev"}
